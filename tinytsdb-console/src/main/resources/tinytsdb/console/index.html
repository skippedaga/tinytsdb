<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counters</title>
  <link rel="stylesheet" href="assets/console.css">
  <script src="assets/console.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <h1 id="title">Counters</h1>
    <form id="series" class="series" autocomplete="off">
      <div id="series-fields" class="series-fields"></div>
      <label class="field">
        <span id="metric-label">Metric</span>
        <select id="metric" name="metric"></select>
      </label>
      <button type="submit" id="apply">Show</button>
    </form>
    <div class="bar-tools">
      <button type="button" id="refresh-toggle" aria-pressed="true">Auto-refresh on</button>
      <button type="button" id="theme-toggle">Dark</button>
    </div>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</header>

<main id="main">
  <p id="empty" class="empty">Fill in the series and choose Show.</p>
  <p id="error" class="error" role="alert" hidden></p>

  <section id="explorer" class="panel" aria-labelledby="explorer-title" hidden>
    <div class="panel-head">
      <h2 id="explorer-title">Windows</h2>
      <fieldset id="window-picker" class="chips"><legend class="sr-only">Windows to show</legend></fieldset>
    </div>
    <div id="tiles" class="tiles"></div>
  </section>

  <div class="columns">
    <section id="overview" class="panel" aria-labelledby="overview-title" hidden>
      <h2 id="overview-title">Calendar</h2>
      <div id="anchored" class="ledger"></div>
      <div id="calendar" class="ledger"></div>
    </section>

    <section id="rolling" class="panel" aria-labelledby="rolling-title" hidden>
      <h2 id="rolling-title">Rolling windows</h2>
      <div class="table-wrap">
        <table id="rolling-table">
          <thead><tr><th scope="col" id="rt-window">Window</th><th scope="col" class="num" id="rt-net">Net</th><th scope="col" class="num" id="rt-added">Added</th><th scope="col" class="num" id="rt-retracted">Retracted</th><th scope="col" id="rt-span">Counted</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <section id="history" class="panel" aria-labelledby="history-title" hidden>
    <div class="panel-head">
      <h2 id="history-title">History</h2>
      <div class="chips" role="group" aria-label="History step">
        <button type="button" class="chip" data-grain="d" aria-pressed="true" id="history-days">Days</button>
        <button type="button" class="chip" data-grain="h" aria-pressed="false" id="history-hours">Hours</button>
      </div>
    </div>
    <div id="chart" class="chart"></div>
    <p id="history-legend" class="legend"><span class="key added"></span><span id="legend-added">Added</span><span class="key retracted"></span><span id="legend-retracted">Retracted</span></p>
  </section>

  <div class="columns">
    <section id="labels" class="panel" aria-labelledby="labels-title" hidden>
      <div class="panel-head">
        <h2 id="labels-title">By label</h2>
        <label class="field compact"><span class="sr-only" id="labels-pick-label">Label</span><select id="label-pick"></select></label>
      </div>
      <div class="table-wrap">
        <table id="labels-table">
          <thead><tr><th scope="col" id="lt-value">Value</th><th scope="col" class="num" id="lt-today">Today</th><th scope="col" class="num" id="lt-all">All time</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="corrections" class="panel" aria-labelledby="corrections-title" hidden>
      <h2 id="corrections-title">Corrections</h2>
      <p id="corrections-note" class="note">Each value is what was added minus what was taken back later: refunds, reversals, status changes.</p>
      <div id="corrections-list" class="ledger"></div>
    </section>
  </div>
</main>

<footer class="foot">
  <p id="store-line"></p>
</footer>
</body>
</html>
